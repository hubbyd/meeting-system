<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#08080c" />
<title>新生见面会 · 我的主页</title>
<meta name="author" content="张和浩 · 信息学院软件2402" />
<link rel="stylesheet" href="/style.css" />
<style>
  .me-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .me-stat { background: rgba(255,255,255,.04); border: 1px solid var(--panel-brd); border-radius: 14px; padding: 10px 12px; }
  .me-stat .k { font-size: 12px; color: var(--muted); }
  .me-stat .v { font-size: 18px; font-weight: 800; margin-top: 3px; }
  .me-stat .v.gold { color: var(--gold); }
  .prize-chip { display: inline-block; margin: 5px 6px 0 0; padding: 6px 12px; border-radius: 999px; font-size: 13px;
    background: linear-gradient(135deg, rgba(255,207,63,.18), rgba(255,122,24,.18));
    border: 1px solid rgba(255,207,63,.45); color: var(--gold); }
  .dm-row { padding: 9px 0; border-bottom: 1px solid var(--panel-brd); }
  .dm-row:last-child { border-bottom: 0; }
</style>
</head>
<body class="checkin">
<div class="aurora"></div>
<div class="grid-overlay"></div>
<canvas id="confetti"></canvas>

<div class="checkin-wrap">
  <div class="hero">
    <div class="logo-big" id="avatar">社</div>
    <h1 id="heroName">同学，你好</h1>
    <p id="heroSub">2026 级新生见面会 · 欢迎你的到来</p>
    <div class="tagline">你 的 专 属 主 页</div>
  </div>

  <!-- 未找到签到记录 -->
  <div class="card" id="missingCard" style="display:none">
    <div class="card-body" style="text-align:center">
      <div style="font-size:40px">🔍</div>
      <h2 style="margin:8px 0 6px;font-size:20px">还没查到你的签到记录</h2>
      <p style="color:var(--muted);margin:0 0 4px">可能是换了手机或浏览器，请先扫码签到</p>
      <a class="btn btn-primary btn-lg" href="/checkin" style="display:inline-block;margin-top:16px;text-decoration:none">去签到</a>
    </div>
  </div>

  <!-- 我的签到卡 -->
  <div class="card" id="meCard" style="display:none">
    <div class="card-head">
      <h2>🎫 我的签到卡</h2>
      <span class="hint" id="meStatus">已签到</span>
    </div>
    <div class="card-body">
      <div class="ticket">
        <div class="lbl">你 的 签 到 编 号</div>
        <div class="no-big" id="ticketNo">--</div>
        <div style="margin-top:10px;font-size:15px" id="ticketName"></div>
        <div style="color:var(--muted);font-size:13px;margin-top:4px" id="ticketDept"></div>
      </div>
      <div class="me-grid">
        <div class="me-stat"><div class="k">签到时间</div><div class="v" id="meTime">--</div></div>
        <div class="me-stat"><div class="k">座位号</div><div class="v" id="meSeat">--</div></div>
        <div class="me-stat"><div class="k">我的积分</div><div class="v gold" id="meScore">0</div></div>
        <div class="me-stat"><div class="k">获奖数量</div><div class="v" id="mePrizeCount">0</div></div>
      </div>
      <div id="mePrizes" style="margin-top:6px"></div>
      <div id="meNote" style="display:none;margin-top:12px;font-size:13px;color:var(--muted)"></div>
    </div>
  </div>

  <!-- 发弹幕 -->
  <div class="card" id="danmuCard" style="display:none">
    <div class="card-head">
      <h2>💬 发弹幕上大屏</h2>
      <span class="hint" id="sentCount">已发送 0 条</span>
    </div>
    <div class="card-body">
      <div class="field">
        <label>你的昵称</label>
        <input id="dName" type="text" maxlength="12" autocomplete="off" placeholder="默认显示你的姓名" />
      </div>
      <div class="field">
        <label>弹幕内容</label>
        <textarea id="dText" rows="2" maxlength="60" placeholder="想说点什么？最多 60 字"></textarea>
      </div>
      <button class="btn btn-primary btn-lg" id="sendBtn" style="width:100%">🚀 发 送 上 墙</button>
      <div class="field" style="margin-top:16px">
        <label>一键快捷短语</label>
        <div class="dept-quick" id="quick"></div>
      </div>
    </div>
  </div>

  <!-- 大屏最新弹幕 -->
  <div class="card" id="wallCard" style="display:none">
    <div class="card-head"><h2>📜 大屏最新弹幕</h2><span class="hint">实时同步</span></div>
    <div class="card-body" id="wall" style="font-size:14px">
      <div class="empty" style="padding:20px">还没有弹幕，快抢第一条～</div>
    </div>
  </div>

  <div class="foot-note">
    校团委社会实践部 · 新生见面会系统<br />
    签到后请留意大屏，抽奖与盲盒马上开始<br />
    技术支持：信息学院软件2402张和浩
  </div>
</div>

<script>
/* ✦ 本系统由 张和浩（信息学院 软件2402）设计开发 ✦ */
console.log('%c✦ 新生见面会系统 · Designed & Built by 张和浩 · 信息学院软件2402', 'color:#ff2d4b;font-size:12px;font-weight:700');
const $ = (id) => document.getElementById(id);
const KEY = 'meetup_me';
const QUICK = ['社实冲鸭！', '我要中奖！', '新生报到，请多关照', '青春正当时', '主持人好帅', '社实最棒！', '来啦来啦', '冲！冲！冲！'];

let S = { participants: [], danmu: [] };
let meId = new URLSearchParams(location.search).get('id') || '';
let lastPrizeCount = -1;
let sent = 0;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function fmtTime(ts) {
  const d = new Date(ts); const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getHours())}:${p(d.getMinutes())}`;
}
function avatarBg(name) {
  let h = 0; for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  return `linear-gradient(140deg, hsl(${h} 85% 58%), hsl(${(h + 45) % 360} 80% 42%))`;
}
function readMe() {
  if (meId) return;
  try { const m = JSON.parse(localStorage.getItem(KEY) || 'null'); if (m && m.id) meId = m.id; } catch (_) {}
}

/* ------------------------------- 渲染 ------------------------------- */
function render() {
  const p = S.participants.find((x) => x.id === meId);
  if (!p) {
    $('missingCard').style.display = '';
    $('meCard').style.display = 'none';
    $('danmuCard').style.display = 'none';
    $('wallCard').style.display = 'none';
    return;
  }
  $('missingCard').style.display = 'none';
  $('meCard').style.display = '';
  $('danmuCard').style.display = '';
  $('wallCard').style.display = '';

  $('avatar').textContent = p.name.slice(-2);
  $('avatar').style.background = avatarBg(p.name);
  $('heroName').textContent = `${p.name}，你好`;
  $('heroSub').textContent = p.dept ? `${p.dept} · 欢迎你的到来` : '欢迎来到 2026 级新生见面会';

  $('ticketNo').textContent = String(p.no).padStart(3, '0');
  $('ticketName').textContent = p.name;
  $('ticketDept').textContent = p.dept || '—';
  $('meTime').textContent = p.checkinAt ? fmtTime(p.checkinAt) : '--';
  $('meSeat').textContent = p.seat || '—';
  $('meScore').textContent = p.score || 0;
  const prizes = p.prizes || [];
  $('mePrizeCount').textContent = prizes.length;
  $('mePrizes').innerHTML = prizes.length
    ? prizes.map((x) => `<span class="prize-chip">🏆 ${esc(x.tier)} · ${esc(x.name)}</span>`).join('')
    : '<div style="font-size:13px;color:var(--dim);margin-top:8px">还没有中奖，祝你欧气满满 🍀</div>';
  if (p.note) { $('meNote').style.display = ''; $('meNote').textContent = `“${p.note}”`; }

  if ($('dName').value === '') $('dName').value = p.name;

  // 新中奖时撒彩带
  if (lastPrizeCount >= 0 && prizes.length > lastPrizeCount) {
    confettiBurst();
    const nw = prizes[prizes.length - 1];
    toast(`🎉 恭喜中奖：${nw.tier} · ${nw.name}`);
  }
  lastPrizeCount = prizes.length;
}

function renderWall() {
  const list = (S.danmu || []).slice(-8).reverse();
  $('wall').innerHTML = list.length
    ? list.map((m) => `<div class="dm-row"><span style="color:var(--red-soft);font-weight:700">${esc(m.name)}</span>
        <span style="margin-left:8px">${esc(m.text)}</span>
        <span style="float:right;color:var(--dim);font-size:12px">${fmtTime(m.at)}</span></div>`).join('')
    : '<div class="empty" style="padding:20px">还没有弹幕，快抢第一条～</div>';
}

/* ------------------------------- 数据 ------------------------------- */
async function load() {
  readMe();
  try { S = await (await fetch('/api/state')).json(); } catch (_) { S = { participants: [], danmu: [] }; }
  render(); renderWall();
}

/* ------------------------------- SSE ------------------------------- */
function connectSSE() {
  const es = new EventSource('/api/stream');
  es.onmessage = (ev) => {
    try {
      const m = JSON.parse(ev.data);
      if (m.t === 'state') { S = m.state; render(); renderWall(); }
      else if (m.t === 'danmu') { S.danmu = (S.danmu || []).concat(m.d); renderWall(); }
      else if (m.t === 'danmu-clear') { S.danmu = []; renderWall(); }
    } catch (_) {}
  };
  es.onerror = () => {};
}

/* ------------------------------- 弹幕发送 ------------------------------- */
QUICK.forEach((q) => {
  const c = document.createElement('div');
  c.className = 'chip'; c.textContent = q;
  c.onclick = () => { $('dText').value = q; $('dText').focus(); };
  $('quick').appendChild(c);
});

const btn = $('sendBtn');
btn.onclick = async () => {
  const text = $('dText').value.trim();
  if (!text) { $('dText').focus(); return toast('请输入弹幕内容'); }
  btn.disabled = true; btn.textContent = '发送中…';
  try {
    const res = await fetch('/api/danmu', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, name: $('dName').value.trim() }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '发送失败');
    sent++;
    $('sentCount').textContent = '已发送 ' + sent + ' 条';
    $('dText').value = '';
    confettiBurst(innerHeight * 0.6);
    toast('已上墙！看大屏 🎉');
  } catch (e) {
    toast('发送失败：' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '🚀 发 送 上 墙';
  }
};
$('dText').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) btn.click(); });

/* ------------------------------- 提示 / 彩带 ------------------------------- */
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.cssText = 'position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:99;text-align:center';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.classList.add('fade'); setTimeout(() => t.remove(), 400); }, 1700);
}

const cv = document.getElementById('confetti'), cx = cv.getContext('2d');
let parts = [], raf = null;
function sizeCv() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', sizeCv); sizeCv();
function confettiBurst(y) {
  const colors = ['#ff2d4b', '#ff7a18', '#ffcf3f', '#22d3ee', '#a855f7', '#34d399'];
  for (let i = 0; i < 90; i++) {
    parts.push({ x: innerWidth / 2 + (Math.random() - .5) * 180, y: y || innerHeight * 0.4,
      vx: (Math.random() - .5) * 11, vy: Math.random() * -12 - 2,
      s: Math.random() * 8 + 4, c: colors[(Math.random() * colors.length) | 0],
      r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3, life: 120 });
  }
  if (!raf) loop();
}
function loop() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach((p) => {
    p.vy += 0.42; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
    cx.globalAlpha = Math.max(0, p.life / 120); cx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6); cx.restore();
  });
  parts = parts.filter((p) => p.life > 0 && p.y < cv.height + 40);
  if (parts.length) raf = requestAnimationFrame(loop); else { raf = null; cx.clearRect(0, 0, cv.width, cv.height); }
}

/* 启动 */
load();
connectSSE();
</script>
</body>
</html>
